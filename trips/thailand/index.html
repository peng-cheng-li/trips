function moneyHTML(){const A=act();const K=CK[DCUR],trA=A.tr[K];
const pairSub=t=>{const o=[];['T','J','C'].forEach(k=>{if(k==K)return;const f=A.tr[k].find(x=>x[0]==t[0]&&x[1]==t[1]);if(f)o.push(fmtD[KC[k]](f[2]))});return o.length?` <small>≈ ${o.join(' · ')}</small>`:''};
let h=`<div class="card"><h2>表示通貨</h2><div class="seg">${['THB','JPY','CNY'].map(c=>`<button type="button" class="${DCUR==c?'on':''}" onclick="setDCUR('${c}')">${c=='THB'?'฿ バーツ':c=='JPY'?'¥ 円':'元 人民元'}</button>`).join('')}</div><p><small>精算・収支の主表示の切替です。計算は今まで通り、各支出を保存時のレートで฿に固定して行います。</small></p></div>`;
h+=`<div class="card"><h2>精算</h2>${A.g.T?`<div class="settle">${trA.length?trA.map(t=>`${esc(t[0])} → ${esc(t[1])} <b>${fmtD[DCUR](t[2])}</b>${pairSub(t)}`).join('<br>'):'差額なし・精算不要'}</div><small>実際に記録した支出から計算</small>`:`<p><small>まだ支出の記録がありません。下のメンバー欄か、プランの項目に「実際」を入れると精算が自動で計算されます。</small></p>`}${WAL}</div>`;
h+=fxCard();
const gt=trio(A.g);
h+=`<div class="card"><h2>実際 · 3人の収支</h2><div class="big">${gt.main} <small>≈ ${gt.sub}</small></div>${MEM.map(m=>{const bal=A.paid[m][K]-A.use[m][K];return `<div class="balrow"><span class="bn">${m}</span><span class="${bal>.5?'pos':bal<-.5?'neg':''}">${bal>.5?'+':''}${fmtD[DCUR](bal)}</span><span class="bd"><small>負担 ${fmtD[DCUR](A.use[m][K])} · 立替 ${fmtD[DCUR](A.paid[m][K])}</small></span></div>`}).join('')}</div>`;
MEM.forEach(m=>{const L=(P.personal||{})[m]||[];h+=`<div class="card"><h2>${m} の支出</h2>`;L.forEach((x,i)=>{h+=`<div class="b" onclick="per('${m}',${i})"><span>${esc(x.name)}${sp(x)}</span><span class="amt"><b>${dispAmt(x)}</b>${baseNote(x)}</span><span class="pen">✎</span></div>`});if(!L.length)h+=`<p><small>まだ記録なし</small></p>`;h+=`<button class="btn" onclick="per('${m}',-1)">＋ ${m} の支出を追加</button></div>`});
return h}
function prepBody(){const L=P.prep||[],st=PST(),dn=L.filter(x=>st[PH(x.t)]).length;
let h=`<div class="card"><h2>出発前チェック</h2><div class="ttl">準備リスト</div><div class="pbar"><i style="width:${L.length?Math.round(dn/L.length*100):0}%"></i></div><small>${dn} / ${L.length} 完了 · チェックはこの端末に保存されます</small>`;
L.forEach((x,i)=>{const on=st[PH(x.t)];h+=`<div class="pr${on?' done':''}" onclick="togP('${PH(x.t)}')"><div class="cb">${on?'✓':''}</div><div class="prt"><b>${esc(x.t)}</b><small>${esc(x.n)}</small>${x.u?` <a class="x" href="${esc(x.u)}" target="_blank" onclick="event.stopPropagation()">開く ↗</a>`:''}</div><button class="ed" onclick="event.stopPropagation();chk(${i})">✎</button></div>`});
h+=`<button class="add" onclick="chk(-1)">＋ 追加</button></div>`;h+=flightsCard();
h+=`<div class="card"><p><small>ルート：バンコク 11/22–25 → パタヤ 11/25–27 → 11/27 未定 → 11/28 帰国便<br>TDAC <a class="x" href="https://tdac.immigration.go.th" target="_blank">入国カード</a> は到着3日前から入力可（11/19〜）。クラブは20歳〜、パスポート原本が必要な店あり。</small></p><div class="cr">背景: <a href="https://commons.wikimedia.org/wiki/File:Chao_Phraya_River_from_Iconsiam_at_night,_Bangkok.jpg" target="_blank">Slyronit</a> / CC BY-SA 4.0</div></div>`;return h}
let CUR='today';
function render(){const sc=MN.scrollTop;document.getElementById('v-today').innerHTML=todayHTML();document.getElementById('v-plan').innerHTML=planHTML();document.getElementById('v-money').innerHTML=moneyHTML();document.getElementById('v-prep').innerHTML=prepBody();tick();MN.scrollTop=sc;spy()}
function tab(n,keep){CUR=n;['today','plan','money','prep'].forEach(x=>{document.getElementById('v-'+x).classList.toggle('on',x==n);document.querySelector('#tabbar [data-t="'+x+'"]').classList.toggle('on',x==n)});MN.scrollTop=0;if(!keep)try{history.replaceState(null,'','#'+n)}catch(e){}if(n=='plan')requestAnimationFrame(spy)}
function jumpDay(i){tab('plan',true);try{history.replaceState(null,'','#day-'+i)}catch(e){}requestAnimationFrame(()=>{const el=document.getElementById('day-'+i);if(el)MN.scrollTo({top:Math.max(0,MN.scrollTop+el.getBoundingClientRect().top-MN.getBoundingClientRect().top-60),behavior:'smooth'})})}
function spy(){if(CUR!='plan')return;let cur=0;document.querySelectorAll('#v-plan .day').forEach(el=>{if(el.getBoundingClientRect().top-MN.getBoundingClientRect().top<=130)cur=+el.id.slice(4)});document.querySelectorAll('.strip button').forEach(b=>{const on=+b.dataset.d==cur;b.classList.toggle('on',on);if(on){const st=b.parentElement,x=b.offsetLeft-st.clientWidth/2+b.clientWidth/2;if(Math.abs(st.scrollLeft-x)>2)st.scrollTo({left:x,behavior:'smooth'})}})}
const PH=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return 'p'+h};
const PST=()=>{try{return JSON.parse(localStorage.getItem('tp_prep')||'{}')}catch(e){return{}}};
function togP(k){const st=PST();st[k]=!st[k];localStorage.setItem('tp_prep',JSON.stringify(st));render()}
function chk(i){const L=P.prep=P.prep||[];const x=i<0?{t:'',n:'',u:''}:L[i];
S.innerHTML=`<div class="ttl">準備項目</div><label>項目</label><input id="f_t" value="${esc(x.t)}"><label>メモ</label><input id="f_n" value="${esc(x.n)}"><label>リンク（任意）</label><input id="f_u" value="${esc(x.u||'')}">\n<div class="acts">${i<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={t:$('#f_t').value,n:$('#f_n').value,u:$('#f_u').value};i<0?L.push(n):L[i]=n;save()};if(i>=0)$('#b_del').onclick=()=>{L.splice(i,1);save()}}

const CATS=['食事','交通','クラブ','マッサージ','入場料','その他'];
function close_(){S.classList.remove('open')}
function row(di,ri){const r=ri<0?{tm:'',name:'',note:'',c:0,k:'食事',q:''}:P.days[di].rows[ri];
S.innerHTML=`<div class="ttl">${ri<0?'追加':'編集'} · DAY ${di}</div><div class="row2"><div><label>時間</label><input id="f_tm" value="${esc(r.tm)}"></div><div><label>金額 ฿/人</label><input id="f_c" type="number" inputmode="numeric" value="${+r.c||0}"></div></div>
<label>名称</label><input id="f_name" value="${esc(r.name)}"><label>説明</label><input id="f_note" value="${esc(r.note)}">
<div class="row2"><div><label>分類</label><select id="f_k">${CATS.map(c=>`<option ${c==(r.k||'その他')?'selected':''}>${c}</option>`).join('')}</select></div><div><label>地図検索（英語名＋都市）</label><input id="f_q" value="${esc(r.q)}"></div></div>
${swSel(r,'各自払い')}<div class="row2"><div><label>実際 ฿（合計・支払済）</label><input id="f_a" type="number" inputmode="numeric" value="${+r.a||''}"></div><div><label>支払者</label><select id="f_p">${MEM.map(m=>`<option ${m==r.p?'selected':''}>${m}</option>`).join('')}</select></div></div><div class="acts">${ri<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={tm:$('#f_tm').value,name:$('#f_name').value,note:$('#f_note').value,c:+$('#f_c').value||0,k:$('#f_k').value,q:$('#f_q').value,s:$('#f_s').value=='1',a:+$('#f_a').value||0,p:$('#f_p').value};const rows=P.days[di].rows;ri<0?rows.push(n):rows[ri]=n;rows.sort((a,b)=>a.tm.localeCompare(b.tm));save()};
if(ri>=0)$('#b_del').onclick=()=>{P.days[di].rows.splice(ri,1);save()}}
function club(di,ci){const d=P.days[di];d.clubs=d.clubs||[];const c=ci<0?{name:'',q:'',note:'',price:'',hours:''}:d.clubs[ci];
S.innerHTML=`<div class="ttl">クラブ · DAY ${di}</div><label>名称</label><input id="f_name" value="${esc(c.name)}"><label>特徴</label><input id="f_note" value="${esc(c.note)}">
<div class="row2"><div><label>料金</label><input id="f_p" value="${esc(c.price)}"></div><div><label>営業時間</label><input id="f_h" value="${esc(c.hours)}"></div></div><label>地図検索（英語名＋都市）</label><input id="f_q" value="${esc(c.q)}">
<div class="acts">${ci<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={name:$('#f_name').value,note:$('#f_note').value,price:$('#f_p').value,hours:$('#f_h').value,q:$('#f_q').value};ci<0?d.clubs.push(n):d.clubs[ci]=n;save()};if(ci>=0)$('#b_del').onclick=()=>{d.clubs.splice(ci,1);save()}}
function ext(i){const x=i<0?{name:'',c:0}:P.extra[i];S.innerHTML=`<div class="ttl">予算項目</div><label>名称</label><input id="f_name" value="${esc(x.name)}"><label>金額 ฿（${P.people}人合計）</label><input id="f_c" type="number" inputmode="numeric" value="${+x.c||0}">${swSel(x,'支払者のみ')}<label>支払者（しない場合）</label><select id="f_p">${['',...MEM].map(m=>`<option value="${m}" ${m==(x.p||'')?'selected':''}>${m||'3人で各自'}</option>`).join('')}</select>
<div class="acts">${i<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={name:$('#f_name').value,c:+$('#f_c').value||0,s:$('#f_s').value=='1',p:$('#f_p').value};i<0?P.extra.push(n):P.extra[i]=n;save()};if(i>=0)$('#b_del').onclick=()=>{P.extra.splice(i,1);save()}}
function rate(){S.innerHTML=`<div class="ttl">レート</div><label>予備レート 1฿ = ¥（自動取得できない時）</label><input id="f_r" type="number" step="0.01" value="${P.rate}"><label>予備レート 1฿ = 元</label><input id="f_rc" type="number" step="0.0001" value="${P.rateC||0.219}"><div class="acts"><button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');$('#b_ok').onclick=()=>{P.rate=+$('#f_r').value||P.rate;P.rateC=+$('#f_rc').value||P.rateC;if(!FX_LIVE){RJ=P.rate;RC=+P.rateC||RC}save()}}
function askKey(){return new Promise(res=>{const d=document.createElement('div');d.className='pw';d.innerHTML=`<div class="glass"><div class="k">編集パスワード（共有）</div><input type="password" id="pw_i" autocomplete="current-password"><small>一度保存すればこの端末では次から不要</small><div class="acts"><button class="cn">取消</button><button class="ok">OK</button></div></div>`;document.body.appendChild(d);
const i=d.querySelector('input'),f=v=>{d.remove();res(v)};i.focus();d.querySelector('.cn').onclick=()=>f('');d.querySelector('.ok').onclick=()=>f(i.value.trim());i.onkeydown=e=>{if(e.key=='Enter')f(i.value.trim())}})}
async function save(){let k=localStorage.getItem('tp_key');if(!k){k=await askKey();if(!k){toast('パスワードが必要です',1);return}}
try{const r=await fetch('/api/plan',{method:'PUT',headers:{'content-type':'application/json','x-edit-key':k},body:JSON.stringify(P)});
if(r.status==401){localStorage.removeItem('tp_key');throw Error('パスワードが違います')}if(!r.ok)throw Error('HTTP '+r.status);
localStorage.setItem('tp_key',k);close_();render();toast('保存しました')}catch(e){toast('保存失敗：'+e.message,1);load(true)}}
async function load(q){try{const r=await fetch('/api/plan',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.days){P=j;if(!FX_LIVE){RJ=+P.rate||RJ;RC=+P.rateC||RC}}}}catch(e){if(!q)toast('オフライン表示',1)}render()}
const fxDay=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10);
async function fetchFX(){try{const c=JSON.parse(localStorage.getItem('tp_fx')||'null');if(c&&c.d==fxDay()&&+c.j>0&&+c.c>0){RJ=+c.j;RC=+c.c;FX_DATE=c.u||'';FX_LIVE=true;render();return}}catch(e){}
try{const r=await fetch('https://open.er-api.com/v6/latest/THB');const j=await r.json();const jpy=j&&j.rates&&+j.rates.JPY,rcv=j&&j.rates&&+j.rates.CNY;
if(jpy>0&&rcv>0){RJ=jpy;RC=rcv;FX_LIVE=true;const dt=j.time_last_update_utc?new Date(j.time_last_update_utc):null;FX_DATE=dt?dt.getUTCFullYear()+'/'+(dt.getUTCMonth()+1)+'/'+dt.getUTCDate():fxDay().replace(/-/g,'/');try{localStorage.setItem('tp_fx',JSON.stringify({d:fxDay(),j:jpy,c:rcv,u:FX_DATE}))}catch(e){}render()}}catch(e){}}
document.getElementById('eb').onclick=e=>{E=!E;document.body.classList.toggle('editing',E);e.target.classList.toggle('on',E);e.target.textContent=E?'✓':'✎';if(!E)close_()};

MN.addEventListener('scroll',()=>requestAnimationFrame(spy));
render();
const h0=location.hash.slice(1),dm=h0.match(/^day-(\d+)$/);
if(dm)jumpDay(+dm[1]);else if(['plan','money','prep'].indexOf(h0)>=0)tab(h0,true);else tab('today',true);
if(location.protocol!='file:'){load();fetchFX();fetchWX()}
</script>
</body>
</html>
