W.innerHTML=h;tick();const L=['概要',...ORD.map(i=>'D'+i),...MEM];
document.getElementById('nav').innerHTML=L.map((l,i)=>`<button class="${i>0&&i<=ORD.length&&PS[ORD[i-1]]?'pt':''}" onclick="go(${i})">${l}</button>`).join('');document.getElementById('dots').innerHTML='<i></i>'.repeat(L.length);W.scrollLeft=keep;on()}
function go(i){W.scrollTo({left:i*W.clientWidth,behavior:'smooth'})}
function on(){const i=Math.round(W.scrollLeft/W.clientWidth);document.querySelectorAll('nav button').forEach((e,j)=>{e.classList.toggle('on',j==i);if(j==i)e.scrollIntoView({inline:'nearest',block:'nearest'})});document.querySelectorAll('.dots i').forEach((e,j)=>e.classList.toggle('on',j==i))}
W.addEventListener('scroll',()=>requestAnimationFrame(on));
const CATS=['食事','交通','クラブ','マッサージ','入場料','その他'];
function close_(){S.classList.remove('open')}
function row(di,ri){const r=ri<0?{tm:'',name:'',note:'',c:0,k:'食事',q:''}:P.days[di].rows[ri];
S.innerHTML=`<div class="ttl">${ri<0?'追加':'編集'} · DAY ${di}</div><div class="row2"><div><label>時間</label><input id="f_tm" value="${esc(r.tm)}"></div><div><label>金額 ฿/人</label><input id="f_c" type="number" inputmode="numeric" value="${+r.c||0}"></div></div>
<label>名称</label><input id="f_name" value="${esc(r.name)}"><label>説明</label><input id="f_note" value="${esc(r.note)}">
<div class="row2"><div><label>分類</label><select id="f_k">${CATS.map(c=>`<option ${c==(r.k||'その他')?'selected':''}>${c}</option>`).join('')}</select></div><div><label>地図検索（英語名＋都市）</label><input id="f_q" value="${esc(r.q)}"></div></div>
${swSel(r,'各自払い')}<div class="row2"><div><label>実際 ฿（合計・支払済）</label><input id="f_a" type="number" inputmode="numeric" value="${+r.a||''}"></div><div><label>支払者</label><select id="f_p">${MEM.map(m=>`<option ${m==r.p?'selected':''}>${m}</option>`).join('')}</select></div></div><div class="acts">${ri<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={tm:$('#f_tm').value,name:$('#f_name').value,note:$('#f_note').value,c:+$('#f_c').value||0,k:$('#f_k').value,q:$('#f_q').value,s:$('#f_s').value=='1',a:+$('#f_a').value||0,p:$('#f_p').value};const rows=P.days[di].rows;ri<0?rows.push(n):rows[ri]=n;rows.sort((a,b)=>a.tm.localeCompare(b.tm));save()};
if(ri>=0)$('#b_del').onclick=()=>{P.days[di].rows.splice(ri,1);save()}}
function club(di,ci){const d=P.days[di];d.clubs=d.clubs||[];const c=ci<0?{name:'',q:'',note:'',price:'',hours:''}:d.clubs[ci];
S.innerHTML=`<div class="ttl">クラブ · DAY ${di}</div><label>名称</label><input id="f_name" value="${esc(c.name)}"><label>特徴</label><input id="f_note" value="${esc(c.note)}">
<div class="row2"><div><label>料金</label><input id="f_p" value="${esc(c.price)}"></div><div><label>営業時間</label><input id="f_h" value="${esc(c.hours)}"></div></div><label>地図検索（英語名＋都市）</label><input id="f_q" value="${esc(c.q)}">
<div class="acts">${ci<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={name:$('#f_name').value,note:$('#f_note').value,price:$('#f_p').value,hours:$('#f_h').value,q:$('#f_q').value};ci<0?d.clubs.push(n):d.clubs[ci]=n;save()};if(ci>=0)$('#b_del').onclick=()=>{d.clubs.splice(ci,1);save()}}
function ext(i){const x=i<0?{name:'',c:0}:P.extra[i];S.innerHTML=`<div class="ttl">予算項目</div><label>名称</label><input id="f_name" value="${esc(x.name)}"><label>金額 ฿（${P.people}人合計）</label><input id="f_c" type="number" inputmode="numeric" value="${+x.c||0}">${swSel(x,'支払者のみ')}<label>支払者（しない場合）</label><select id="f_p">${['',...MEM].map(m=>`<option value="${m}" ${m==(x.p||'')?'selected':''}>${m||'3人で各自'}</option>`).join('')}</select>
<div class="acts">${i<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={name:$('#f_name').value,c:+$('#f_c').value||0,s:$('#f_s').value=='1',p:$('#f_p').value};i<0?P.extra.push(n):P.extra[i]=n;save()};if(i>=0)$('#b_del').onclick=()=>{P.extra.splice(i,1);save()}}
function rate(){S.innerHTML=`<div class="ttl">レート</div><label>1฿ = ¥</label><input id="f_r" type="number" step="0.01" value="${P.rate}"><div class="acts"><button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');$('#b_ok').onclick=()=>{P.rate=+$('#f_r').value||P.rate;save()}}
function askKey(){return new Promise(res=>{const d=document.createElement('div');d.className='pw';d.innerHTML=`<div class="glass"><div class="k">編集パスワード（共有）</div><input type="password" id="pw_i" autocomplete="current-password"><small>一度保存すればこの端末では次から不要</small><div class="acts"><button class="cn">取消</button><button class="ok">OK</button></div></div>`;document.body.appendChild(d);
const i=d.querySelector('input'),f=v=>{d.remove();res(v)};i.focus();d.querySelector('.cn').onclick=()=>f('');d.querySelector('.ok').onclick=()=>f(i.value.trim());i.onkeydown=e=>{if(e.key=='Enter')f(i.value.trim())}})}
async function save(){let k=localStorage.getItem('tp_key');if(!k){k=await askKey();if(!k){toast('パスワードが必要です',1);return}}
try{const r=await fetch('/api/plan',{method:'PUT',headers:{'content-type':'application/json','x-edit-key':k},body:JSON.stringify(P)});
if(r.status==401){localStorage.removeItem('tp_key');throw Error('パスワードが違います')}if(!r.ok)throw Error('HTTP '+r.status);
localStorage.setItem('tp_key',k);close_();render();toast('保存しました')}catch(e){toast('保存失敗：'+e.message,1);load(true)}}
async function load(q){try{const r=await fetch('/api/plan',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.days)P=j}}catch(e){if(!q)toast('オフライン表示',1)}render()}
document.getElementById('eb').onclick=e=>{E=!E;document.body.classList.toggle('editing',E);e.target.classList.toggle('on',E);e.target.textContent=E?'✓':'✎';if(!E)close_()};
render();const hs=parseInt(location.hash.slice(1));if(hs)W.scrollLeft=hs*W.clientWidth;else{const n=+NOW();if(n>=DEP&&n<RET)W.scrollLeft=W.clientWidth}on();if(location.protocol!='file:')load();
</script></body></html>
