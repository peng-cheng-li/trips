<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120b2e"><title>タイ バンコク＋パタヤ 2026</title><style>
:root{--g:rgba(255,255,255,.12);--gb:rgba(255,255,255,.28);--mut:rgba(255,255,255,.68);--a:#ffb86b;--top:calc(96px + env(safe-area-inset-top))}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:"Inter","SF Pro Display",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
body{background:#120b2e}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 15% 20%,#ff3d7f 0,transparent 70%),radial-gradient(35% 30% at 85% 15%,#7b5cff 0,transparent 70%),radial-gradient(45% 40% at 70% 85%,#ff9d2e 0,transparent 70%),radial-gradient(40% 35% at 10% 90%,#00c2d1 0,transparent 70%),linear-gradient(160deg,#0b0624,#1d0f45 50%,#2a0e3a);filter:blur(40px) saturate(1.2)}
.glass{background:var(--g);border:1px solid var(--gb);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 10px 40px -10px #0006,inset 0 1px 0 #ffffff33}
header{position:fixed;top:0;left:0;right:0;z-index:3;padding:calc(8px + env(safe-area-inset-top)) 10px 6px;height:var(--top);border-width:0 0 1px;border-radius:0}
.hd{display:flex;justify-content:space-between;align-items:center}.k{font-size:.68rem;letter-spacing:.12em;color:var(--mut)}
.eb{border:1px solid var(--gb);background:#ffffff1f;color:#fff;border-radius:99px;padding:4px 12px;font:inherit;font-size:.75rem;font-weight:700}.eb.on{background:var(--a);color:#1b0b2e;border-color:var(--a)}
nav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-top:7px}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid #ffffff2a;border-radius:99px;padding:5px 11px;font:inherit;font-size:.76rem;font-weight:700;background:#ffffff14;color:#fff}nav button.on{background:#fff;color:#1b0b2e}
.dots{display:flex;justify-content:center;gap:5px;margin-top:7px}.dots i{width:5px;height:5px;border-radius:50%;background:#ffffff4d;transition:.2s}.dots i.on{background:#fff;width:14px;border-radius:3px}
.w{position:fixed;top:var(--top);bottom:0;left:0;right:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.w::-webkit-scrollbar{display:none}
.s{flex:0 0 100%;scroll-snap-align:start;padding:12px 12px calc(12px + env(safe-area-inset-bottom));height:100%}
.in{height:100%;overflow-y:auto;border-radius:24px;padding:16px;max-width:560px;margin:auto;display:flex;flex-direction:column}
h2{font-size:.68rem;letter-spacing:.14em;color:var(--mut);margin:10px 0 4px;font-weight:600;text-transform:uppercase}h2:first-child{margin-top:0}
.ttl{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
p{font-size:.88rem;margin:6px 0;line-height:1.5}small{color:var(--mut);font-size:.74rem}
a.x{color:var(--a);font-weight:700;text-decoration:none}
.y{font-size:.7rem;color:#1b0b2e;background:var(--a);border-radius:6px;padding:1px 6px;white-space:nowrap;font-weight:700}
.tag{background:#ffffff26;border-radius:6px;padding:1px 6px;font-size:.7rem;font-weight:700}
.tl{flex:1}.q{display:grid;grid-template-columns:44px 14px 1fr auto;column-gap:6px}
.t{font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums;padding:7px 0}
.d{position:relative}.d::before{content:"";position:absolute;left:3px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a)}
.d::after{content:"";position:absolute;left:6.5px;top:23px;bottom:-13px;width:1px;background:#ffffff33}.q:last-child .d::after{display:none}
.c{font-size:.92rem;padding:7px 0;min-width:0}.c small{display:block;line-height:1.35;margin-top:1px}
.ed{display:none;border:0;background:#ffffff1f;color:#fff;border-radius:8px;width:30px;height:30px;margin-top:5px;font-size:.8rem}.editing .ed{display:block}
.add{display:none;margin-top:8px;border:1px dashed #ffffff55;background:transparent;color:#fff;border-radius:12px;padding:9px;font:inherit;font-weight:700}.editing .add{display:block}
.sub{margin-top:10px;padding-top:10px;border-top:1px dashed #ffffff40;font-weight:800;font-size:.9rem;text-align:right}
.b{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:.84rem;padding:7px 0;border-bottom:1px solid #ffffff1a}.b b{white-space:nowrap}
.big{font-size:1.6rem;font-weight:800}
.btn{display:block;text-align:center;margin-top:14px;background:linear-gradient(135deg,#ff9d2e,#ff3d7f);color:#fff;border-radius:14px;padding:12px;font-weight:800;text-decoration:none;box-shadow:0 8px 24px -8px #ff3d7f99}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.25s;background:rgba(30,16,60,.55)}.sheet.open{transform:none}
.sheet label{display:block;font-size:.7rem;color:var(--mut);margin:8px 0 3px}.sheet input,.sheet select{width:100%;border:1px solid #ffffff40;background:#ffffff1a;color:#fff;border-radius:10px;padding:9px;font:inherit;font-size:16px}
.sheet select option{color:#000}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:8px;margin-top:14px}.acts button{flex:1;border:0;border-radius:12px;padding:11px;font:inherit;font-weight:800}
.ok{background:#fff;color:#1b0b2e}.cn{background:#ffffff26;color:#fff}.del{background:#ff4d6d;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;padding:10px 16px;border-radius:12px;font-size:.85rem;font-weight:700;display:none}.toast.err{background:#ff4d6dcc}
</style></head><body>
<header class="glass"><div class="hd"><div class="k">THAILAND · 11.22–28 · Hiro・Fujisaki・Li</div><button class="eb" id="eb">編集</button></div><nav id="nav"></nav><div class="dots" id="dots"></div></header>
<div class="w" id="w"></div>
<div class="sheet glass" id="sheet"></div><div class="toast glass" id="toast"></div>
<script>
const DEF=__PLAN__;let P=JSON.parse(JSON.stringify(DEF)),E=false;
const W=document.getElementById('w'),S=document.getElementById('sheet'),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen=b=>'¥'+(Math.round(b*P.rate/100)*100).toLocaleString(),th=b=>'฿'+Number(b).toLocaleString();
const map=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const M='Metropole Bangkok Tribute Portfolio Hotel',WAL='<a class="btn" href="https://walica.jp/group/01M6DMSTVSD5AKZDK68FS8JGV6" target="_blank">割り勘（walica）</a>';
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast glass'+(err?' err':'');t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
function render(){const keep=W.scrollLeft;let h=`<section class="s"><div class="in glass"><h2>概要</h2><div class="ttl">バンコク＋パタヤ</div>
<p>Hiro・Fujisaki・Li<br>11/22 NRT 18:30 → BKK 23:55<br>11/28 DMK 23:55 → NRT 08:00</p>
<p><span class="tag">TDAC</span> <a class="x" href="https://tdac.immigration.go.th" target="_blank">入国カード登録</a> 到着3日前から・1人1件</p>
<h2>ホテル</h2><p>パタヤ：<a class="x" href="${map('Jomtien Beach Pattaya')}" target="_blank">ジョムティエン周辺</a>（2室）</p>
<p>バンコク：<a class="x" href="https://www.marriott.com/en-us/hotels/bkktm-metropole-bangkok-a-tribute-portfolio-hotel/overview/" target="_blank">メトロポール</a> · <a class="x" href="${map(M)}" target="_blank">地図</a><br><small>トンロー北端・ARLラムカムヘン1.7km・移動はGrab・ツイン27㎡</small></p>
<h2>注意</h2><p><small>クラブは20歳〜・パスポート原本必須。営業時間は当日確認。</small></p>${WAL}</div></section>`;
const cat={};P.days.forEach((d,di)=>{let tot=0;h+=`<section class="s"><div class="in glass"><h2>DAY ${di} · ${esc(d.d)}</h2><div class="ttl">${esc(d.t)}</div><div class="tl">`;
d.rows.forEach((r,ri)=>{const c=+r.c||0;tot+=c;if(c){const k=r.k||'その他';cat[k]=(cat[k]||0)+c*P.people}
const nm=r.q?`<a class="x" href="${map(r.q)}" target="_blank">${esc(r.name)}</a>`:esc(r.name);
h+=`<div class="q"><div class="t">${esc(r.tm)}</div><div class="d"></div><div class="c">${nm}${c?` <span class="y">約${th(c)}/人</span>`:''}<small>${esc(r.note)}</small></div><button class="ed" onclick="row(${di},${ri})">✎</button></div>`});
h+=`</div><button class="add" onclick="row(${di},-1)">＋ 追加</button><div class="sub">当日小計 約${th(tot)}/人 ≈ ${yen(tot)}</div></div></section>`});
P.extra.forEach(x=>cat[x.name]=(cat[x.name]||0));let tot=0;const lines=[];
Object.entries(cat).forEach(([k,v])=>{if(!P.extra.some(x=>x.name==k)){lines.push(`<div class="b"><span>${esc(k)}</span><b>約${th(v)}</b><span></span></div>`);tot+=v}});
P.extra.forEach((x,i)=>{tot+=+x.c||0;lines.push(`<div class="b"><span>${esc(x.name)}</span><b>約${th(x.c)}</b><button class="ed" onclick="ext(${i})">✎</button></div>`)});
h+=`<section class="s"><div class="in glass"><h2>予算 · ${P.people}人 · 目安</h2><div class="big">約${th(tot)}</div><p>≈ ${yen(tot)} ／ 1人 約${th(Math.round(tot/P.people))} ≈ ${yen(tot/P.people)}<br><small>1฿≈¥${P.rate}（2026/11/2）・日別の金額から自動集計</small></p>${lines.join('')}
<div class="b"><span>航空券</span><b>${esc(P.flight)}</b><span></span></div><button class="add" onclick="ext(-1)">＋ 項目追加</button><button class="add" onclick="rate()">レート変更</button><p><small>ホテル料金は未確認の目安。</small></p>${WAL}</div></section>`;
W.innerHTML=h;const L=['概要',...P.days.map((_,i)=>'D'+i),'予算'];
document.getElementById('nav').innerHTML=L.map((l,i)=>`<button onclick="go(${i})">${l}</button>`).join('');document.getElementById('dots').innerHTML='<i></i>'.repeat(L.length);W.scrollLeft=keep;on()}
function go(i){W.scrollTo({left:i*W.clientWidth,behavior:'smooth'})}
function on(){const i=Math.round(W.scrollLeft/W.clientWidth);document.querySelectorAll('nav button').forEach((e,j)=>{e.classList.toggle('on',j==i);if(j==i)e.scrollIntoView({inline:'nearest',block:'nearest'})});document.querySelectorAll('.dots i').forEach((e,j)=>e.classList.toggle('on',j==i))}
W.addEventListener('scroll',()=>requestAnimationFrame(on));
const CATS=['食事','交通','クラブ','マッサージ','入場料','その他'];
function close_(){S.classList.remove('open')}
function row(di,ri){const r=ri<0?{tm:'',name:'',note:'',c:0,k:'食事',q:''}:P.days[di].rows[ri];
S.innerHTML=`<div class="ttl">${ri<0?'追加':'編集'} · DAY ${di}</div><div class="row2"><div><label>時間</label><input id="f_tm" value="${esc(r.tm)}"></div><div><label>金額 ฿/人</label><input id="f_c" type="number" inputmode="numeric" value="${+r.c||0}"></div></div>
<label>名称</label><input id="f_name" value="${esc(r.name)}"><label>説明</label><input id="f_note" value="${esc(r.note)}">
<div class="row2"><div><label>分類</label><select id="f_k">${CATS.map(c=>`<option ${c==(r.k||'その他')?'selected':''}>${c}</option>`).join('')}</select></div><div><label>地図検索（英語名＋都市）</label><input id="f_q" value="${esc(r.q)}"></div></div>
<div class="acts">${ri<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={tm:$('#f_tm').value,name:$('#f_name').value,note:$('#f_note').value,c:+$('#f_c').value||0,k:$('#f_k').value,q:$('#f_q').value};const rows=P.days[di].rows;ri<0?rows.push(n):rows[ri]=n;rows.sort((a,b)=>a.tm.localeCompare(b.tm));save()};
if(ri>=0)$('#b_del').onclick=()=>{P.days[di].rows.splice(ri,1);save()}}
function ext(i){const x=i<0?{name:'',c:0}:P.extra[i];S.innerHTML=`<div class="ttl">予算項目</div><label>名称</label><input id="f_name" value="${esc(x.name)}"><label>金額 ฿（${P.people}人合計）</label><input id="f_c" type="number" inputmode="numeric" value="${+x.c||0}">
<div class="acts">${i<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={name:$('#f_name').value,c:+$('#f_c').value||0};i<0?P.extra.push(n):P.extra[i]=n;save()};if(i>=0)$('#b_del').onclick=()=>{P.extra.splice(i,1);save()}}
function rate(){S.innerHTML=`<div class="ttl">レート</div><label>1฿ = ¥</label><input id="f_r" type="number" step="0.01" value="${P.rate}"><div class="acts"><button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');$('#b_ok').onclick=()=>{P.rate=+$('#f_r').value||P.rate;save()}}
async function save(){let k=localStorage.getItem('tp_key');if(!k){k=prompt('編集用の共有パスワード');if(!k){toast('パスワードが必要です',1);return}}
try{const r=await fetch('/api/plan',{method:'PUT',headers:{'content-type':'application/json','x-edit-key':k},body:JSON.stringify(P)});
if(r.status==401){localStorage.removeItem('tp_key');throw Error('パスワードが違います')}if(!r.ok)throw Error('HTTP '+r.status);
localStorage.setItem('tp_key',k);close_();render();toast('保存しました')}catch(e){toast('保存失敗：'+e.message,1);load(true)}}
async function load(q){try{const r=await fetch('/api/plan',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.days)P=j}}catch(e){if(!q)toast('オフライン表示',1)}render()}
document.getElementById('eb').onclick=e=>{E=!E;document.body.classList.toggle('editing',E);e.target.classList.toggle('on',E);e.target.textContent=E?'完了':'編集';if(!E)close_()};
render();const hs=parseInt(location.hash.slice(1));if(hs)W.scrollLeft=hs*W.clientWidth;on();if(location.protocol!='file:')load();
</script></body></html>
