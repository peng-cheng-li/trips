<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0c0e"><title>タイ バンコク＋パタヤ 2026</title><style>
:root{--g:rgba(20,20,22,.32);--gb:rgba(255,255,255,.22);--mut:rgba(255,255,255,.7);--a:#e8d5a8;--bar:calc(112px + env(safe-area-inset-bottom))}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:-apple-system,"SF Pro Text","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;font-size:17px}
body{background:#0c0c0e}
body::before{content:"";position:fixed;inset:-30px;z-index:-2;background:url(/bg.webp) center/cover no-repeat;filter:blur(3px) saturate(.75) brightness(.95)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,8,10,.3),rgba(8,8,10,.55))}
.glass{background:var(--g);border:1px solid var(--gb);-webkit-backdrop-filter:blur(24px) saturate(1.2);backdrop-filter:blur(24px) saturate(1.2);box-shadow:0 10px 40px -12px #000a,inset 0 1px 0 #ffffff1f}
header{position:fixed;bottom:0;left:0;right:0;z-index:3;padding:8px 10px calc(8px + env(safe-area-inset-bottom));height:var(--bar);border-width:1px 0 0;border-radius:0;display:flex;flex-direction:column-reverse}
.hd{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.k{font-size:.72rem;letter-spacing:.08em;color:var(--mut)}
.eb{border:1px solid var(--gb);background:#ffffff14;color:#fff;border-radius:99px;padding:5px 14px;font:inherit;font-size:.82rem;font-weight:700}.eb.on{background:var(--a);color:#1a1712;border-color:var(--a)}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;border-radius:12px;padding:8px 14px;font:inherit;font-size:.9rem;font-weight:700;background:transparent;color:var(--mut)}nav button.on{background:#ffffff26;color:var(--a)}
.dots{display:flex;justify-content:center;gap:5px;margin-bottom:6px}.dots i{width:5px;height:5px;border-radius:50%;background:#ffffff40;transition:.2s}.dots i.on{background:var(--a);width:14px;border-radius:3px}
.w{position:fixed;top:0;bottom:var(--bar);left:0;right:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.w::-webkit-scrollbar{display:none}
.s{flex:0 0 100%;scroll-snap-align:start;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;height:100%}
.in{height:100%;overflow-y:auto;border-radius:26px;padding:18px;max-width:560px;margin:auto;display:flex;flex-direction:column}
h2{font-size:.75rem;letter-spacing:.14em;color:var(--mut);margin:12px 0 4px;font-weight:600}h2:first-child{margin-top:0}
.ttl{font-size:1.65rem;font-weight:800;letter-spacing:-.01em;margin-bottom:10px;line-height:1.25}
p{font-size:1rem;margin:7px 0;line-height:1.55}small{color:var(--mut);font-size:.85rem}
a.x{color:var(--a);font-weight:700;text-decoration:none}
.y{font-size:.8rem;color:var(--a);border:1px solid #e8d5a866;border-radius:7px;padding:0 6px;white-space:nowrap;font-weight:700}
.tag{border:1px solid #ffffff55;border-radius:6px;padding:1px 6px;font-size:.78rem;font-weight:700}
.tl{flex:1}.q{display:grid;grid-template-columns:54px 14px 1fr auto;column-gap:6px}
.t{font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;padding:8px 0}
.d{position:relative}.d::before{content:"";position:absolute;left:3px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--a)}
.d::after{content:"";position:absolute;left:6.5px;top:25px;bottom:-15px;width:1px;background:#ffffff33}.q:last-child .d::after{display:none}
.c{font-size:1.03rem;padding:8px 0;min-width:0}.c small{display:block;line-height:1.4;margin-top:2px}
.ed{display:none;border:0;background:#ffffff1f;color:#fff;border-radius:9px;width:34px;height:34px;margin-top:6px;font-size:.9rem}.editing .ed{display:block}
.add{display:none;margin-top:10px;border:1px dashed #ffffff55;background:transparent;color:#fff;border-radius:12px;padding:11px;font:inherit;font-weight:700}.editing .add{display:block}
.sub{margin-top:12px;padding-top:12px;border-top:1px dashed #ffffff40;font-weight:800;font-size:1.05rem;text-align:right}
.b{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:.98rem;padding:9px 0;border-bottom:1px solid #ffffff1a}.b b{white-space:nowrap}
.big{font-size:2rem;font-weight:800}
.btn{display:block;text-align:center;margin-top:16px;background:var(--a);color:#1a1712;border-radius:14px;padding:14px;font-weight:800;text-decoration:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.25s;background:rgba(24,24,26,.6)}.sheet.open{transform:none}
.sheet label{display:block;font-size:.8rem;color:var(--mut);margin:9px 0 3px}.sheet input,.sheet select{width:100%;border:1px solid #ffffff40;background:#ffffff14;color:#fff;border-radius:10px;padding:10px;font:inherit;font-size:17px}
.sheet select option{color:#000}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:8px;margin-top:16px}.acts button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:800}
.ok{background:var(--a);color:#1a1712}.cn{background:#ffffff26;color:#fff}.del{background:#b8524f;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 12px);transform:translateX(-50%);z-index:9;padding:10px 16px;border-radius:12px;font-size:.92rem;font-weight:700;display:none}.toast.err{background:#b8524fcc}
.cl{display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px 0;border-bottom:1px solid #ffffff1a;font-size:1rem}.cl small{display:block;line-height:1.4}.cl .hr{display:inline;color:var(--a);opacity:.8}

:root{--bar:calc(76px + env(safe-area-inset-bottom))}
header{left:12px;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));height:56px;padding:6px 6px 6px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.25);flex-direction:row;align-items:center;gap:6px;background:rgba(28,28,30,.45);box-shadow:0 8px 30px -8px rgba(0,0,0,.6)}
header .hd{order:2;margin:0}header .k,header .dots{display:none}
nav{flex:1;gap:2px;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 14px),transparent);padding:0 6px}
nav button{border:0;background:none;padding:7px 12px;border-radius:999px;font-size:.92rem;color:rgba(255,255,255,.62)}nav button.on{background:rgba(255,255,255,.16);color:var(--a)}
.eb{width:44px;height:44px;padding:0;border-radius:50%;font-size:1.15rem;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.w{bottom:0}.s{padding-bottom:calc(var(--bar) + 6px)}
.toast{bottom:calc(var(--bar) + 10px)}
.cr{font-size:.7rem;color:#ffffff80;margin-top:auto;padding-top:12px}.cr a{color:inherit}
.ov p{margin:5px 0}.ov p small{display:block}.ov h2{margin-top:16px}.bx{padding:12px 14px;border-radius:16px;background:#ffffff12;border:1px solid #ffffff22;margin-bottom:4px}.bx .big{font-size:1.75rem}.bx .big small{font-size:1rem;color:var(--mut)}.pp{color:var(--a);font-weight:800;font-size:1.05rem}.ov .btn{margin-top:10px;padding:12px}.ov .b{padding:5px 0;font-size:.92rem}.ov .ttl small{font-size:1rem;color:var(--mut)}
.sp{font-size:.7rem;font-weight:700;border-radius:6px;padding:0 5px;margin-left:4px;background:#e8d5a833;color:var(--a);white-space:nowrap}.sp.no{background:#ffffff1a;color:var(--mut)}.mi{color:#ffb4a8;border-color:#ffb4a888}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 6px}.pm div{background:#ffffff14;border-radius:12px;padding:8px 6px;text-align:center}.pm span{display:block;font-size:.78rem;color:var(--mut)}.pm b{display:block;font-size:1.02rem}.pm small{font-size:.75rem}.pp small{color:var(--mut);font-weight:600;font-size:.85rem}.pen{color:var(--mut)}
button.btn{width:100%;border:0;font:inherit;font-weight:800}
</style></head><body>
<header class="glass"><div class="hd"><div class="k">THAILAND · 11.22–28 · Hiro・Fujisaki・Li</div><button class="eb" id="eb" aria-label="編集">✎</button></div><nav id="nav"></nav><div class="dots" id="dots"></div></header>
<div class="w" id="w"></div>
<div class="sheet glass" id="sheet"></div><div class="toast glass" id="toast"></div>
<script>
const DEF=__PLAN__;let P=JSON.parse(JSON.stringify(DEF)),E=false;
const W=document.getElementById('w'),S=document.getElementById('sheet'),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen=b=>'¥'+(Math.round(b*P.rate/100)*100).toLocaleString(),th=b=>'฿'+Number(b).toLocaleString();
const map=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const M='Metropole Bangkok Tribute Portfolio Hotel',WAL='<a class="btn" href="https://walica.jp/group/01M6DMSTVSD5AKZDK68FS8JGV6" target="_blank">割り勘（walica）</a>';
const MEM=['Hiro','Fujisaki','Li'];const on_=x=>x.s!==false;
const sp=x=>` <span class="sp ${on_(x)?'':'no'}">${on_(x)?'割り勘':'各自'}</span>`;
function calc(){const per={};MEM.forEach(m=>per[m]=0);let spl=0;
P.days.forEach(d=>d.rows.forEach(r=>{const c=+r.c||0;if(on_(r))spl+=c*P.people;else MEM.forEach(m=>per[m]+=c)}));
P.extra.forEach(x=>{const c=+x.c||0;if(on_(x))spl+=c;else if(per[x.p]!=null)per[x.p]+=c;else MEM.forEach(m=>per[m]+=c/P.people)});
MEM.forEach(m=>((P.personal||{})[m]||[]).forEach(x=>{const c=+x.c||0;if(on_(x))spl+=c;else per[m]+=c}));
MEM.forEach(m=>per[m]+=spl/P.people);return{per,sp:spl,g:Object.values(per).reduce((a,b)=>a+b,0)}}
const swSel=(x,lbl)=>`<label>割り勘</label><select id="f_s"><option value="1" ${on_(x)?'selected':''}>割り勘する（${P.people}人で分ける）</option><option value="0" ${on_(x)?'':'selected'}>しない（${lbl}）</option></select>`;
function per(m,i){P.personal=P.personal||{};const L=P.personal[m]=P.personal[m]||[];const x=i<0?{name:'',c:0,s:false}:L[i];
S.innerHTML=`<div class="ttl">${m} · ${i<0?'追加':'編集'}</div><label>項目</label><input id="f_name" value="${esc(x.name)}"><label>金額 ฿</label><input id="f_c" type="number" inputmode="numeric" value="${+x.c||0}">${swSel(x,m+'のみ')}
<div class="acts">${i<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={name:$('#f_name').value,c:+$('#f_c').value||0,s:$('#f_s').value=='1'};i<0?L.push(n):L[i]=n;save()};if(i>=0)$('#b_del').onclick=()=>{L.splice(i,1);save()}}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast glass'+(err?' err':'');t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
function render(){const keep=W.scrollLeft;let h='';
const cat={};P.days.forEach((d,di)=>{let tot=0;h+=`<section class="s"><div class="in glass"><h2>DAY ${di} · ${esc(d.d)}</h2><div class="ttl">${esc(d.t)}</div><div class="tl">`;
d.rows.forEach((r,ri)=>{const c=+r.c||0;tot+=c;if(c){const k=r.k||'その他';cat[k]=(cat[k]||0)+c*P.people}
const nm=r.q?`<a class="x" href="${map(r.q)}" target="_blank">${esc(r.name)}</a>`:esc(r.name);
h+=`<div class="q"><div class="t">${esc(r.tm)}</div><div class="d"></div><div class="c">${nm}${c?` <span class="y">約${th(c)}/人</span>${sp(r)}`:''}<small>${esc(r.note)}</small></div><button class="ed" onclick="row(${di},${ri})">✎</button></div>`});
h+=`</div><button class="add" onclick="row(${di},-1)">＋ 追加</button>`;
if(di>0&&di<P.days.length-1){h+=`<h2>おすすめクラブ3選</h2>`;(d.clubs||[]).forEach((c,ci)=>{h+=`<div class="cl"><div><a class="x" href="${map(c.q||c.name)}" target="_blank">${esc(c.name)}</a> <small class="hr">${esc(c.hours)}</small><small>${esc(c.note)} · ${esc(c.price)}</small></div><button class="ed" onclick="club(${di},${ci})">✎</button></div>`});h+=`<button class="add" onclick="club(${di},-1)">＋ クラブ追加</button>`}
h+=`<div class="sub">当日小計 約${th(tot)}/人 ≈ ${yen(tot)}</div></div></section>`});
P.extra.forEach(x=>cat[x.name]=(cat[x.name]||0));let tot=0;const lines=[];const T=calc();
Object.entries(cat).forEach(([k,v])=>{if(!P.extra.some(x=>x.name==k)){lines.push(`<div class="b"><span>${esc(k)}</span><b>約${th(v)}</b><span></span></div>`);tot+=v}});
P.extra.forEach((x,i)=>{tot+=+x.c||0;lines.push(`<div class="b"><span>${/宿泊|ホテル/.test(x.name)?'<span class="tag mi">未定</span> ':''}${esc(x.name)}${sp(x)}</span><b>約${th(x.c)}</b><button class="ed" onclick="ext(${i})">✎</button></div>`)});
const pp=Math.round(tot/P.people);
const ov=`<section class="s"><div class="in glass ov"><h2>概要 · Hiro・Fujisaki・Li</h2><div class="ttl">バンコク＋パタヤ<small> 11/22–28</small></div>
<div class="bx"><div class="k">合計（航空券別・ホテルは候補の目安）</div><div class="big">約${th(T.g)} <small>≈ ${yen(T.g)}</small></div><div class="pp">割り勘分 約${th(T.sp)} ≈ ${yen(T.sp)}<small>（1人 ${th(Math.round(T.sp/P.people))}）</small></div>
<div class="pm">${MEM.map(m=>`<div onclick="go(${P.days.length+1+MEM.indexOf(m)})"><span>${m}</span><b>${th(Math.round(T.per[m]))}</b><small>${yen(T.per[m])}</small></div>`).join('')}</div><small>1人 = 自分の割り勘しない分 ＋ 割り勘分の1/${P.people}</small></div>
<h2>内訳</h2>${lines.join('')}<div class="b"><span>航空券（3人）</span><b>${esc(P.flight||'¥78,970')}</b><span></span></div>
<button class="add" onclick="ext(-1)">＋ 予算項目追加</button><button class="add" onclick="rate()">レート変更</button>
<small>1฿≈¥${P.rate}・日別の金額から自動集計・ホテル未予約（候補）</small>${WAL}
<h2>フライト</h2><p>✈ 11/22 NRT T2 18:30 → BKK 23:55<br>✈ 11/28 DMK T1 23:55 → NRT 08:00（11/29）</p>
<h2>ルート・ホテル</h2>
<p>① 11/22–24 バンコク：<span class="tag mi">未定</span> <a class="x" href="${map(M)}" target="_blank">メトロポール（候補）</a><small>トンロー・ツイン2室</small></p>
<p>② 11/24–26 パタヤ：<span class="tag mi">未定</span> <a class="x" href="${map('March Hotel Pattaya 323/9 Moo 9 Nongprue')}" target="_blank">マーチホテル（候補）</a><small>セカンドロード・Walking St 車10分・2室</small></p>
<p>③ 11/26–28 バンコク：<span class="tag mi">未定</span> <a class="x" href="${map(M)}" target="_blank">メトロポール（候補）</a><small>11/28夜 DMKへ</small></p>
<h2>注意</h2><p><small><span class="tag">TDAC</span> <a class="x" href="https://tdac.immigration.go.th" target="_blank">入国カード</a> 到着3日前〜・1人1件／クラブは20歳〜・パスポート原本</small></p>
<div class="cr">背景: <a href="https://commons.wikimedia.org/wiki/File:Chao_Phraya_River_from_Iconsiam_at_night,_Bangkok.jpg" target="_blank">Slyronit</a> / CC BY-SA 4.0</div></div></section>`;h=ov+h;
MEM.forEach(m=>{const L=(P.personal||{})[m]||[];h+=`<section class="s"><div class="in glass"><h2>個人 · 自分の支出</h2><div class="ttl">${m}</div>
<div class="bx"><div class="k">${m}の合計</div><div class="big">約${th(Math.round(T.per[m]))} <small>≈ ${yen(T.per[m])}</small></div><small>割り勘分 ${th(Math.round(T.sp/P.people))} ＋ 各自分 ${th(Math.round(T.per[m]-T.sp/P.people))}</small></div><h2>個人の項目</h2>`;
L.forEach((x,i)=>{h+=`<div class="b" onclick="per('${m}',${i})"><span>${esc(x.name)}${sp(x)}</span><b>${th(x.c)}</b><span class="pen">✎</span></div>`});
if(!L.length)h+=`<p><small>まだありません。下のボタンで追加（割り勘する項目は3人で分けて計算）</small></p>`;
h+=`<button class="btn" onclick="per('${m}',-1)">＋ 支出を追加</button>${WAL}</div></section>`});
W.innerHTML=h;const L=['概要',...P.days.map((_,i)=>'D'+i),...MEM];
document.getElementById('nav').innerHTML=L.map((l,i)=>`<button onclick="go(${i})">${l}</button>`).join('');document.getElementById('dots').innerHTML='<i></i>'.repeat(L.length);W.scrollLeft=keep;on()}
function go(i){W.scrollTo({left:i*W.clientWidth,behavior:'smooth'})}
function on(){const i=Math.round(W.scrollLeft/W.clientWidth);document.querySelectorAll('nav button').forEach((e,j)=>{e.classList.toggle('on',j==i);if(j==i)e.scrollIntoView({inline:'nearest',block:'nearest'})});document.querySelectorAll('.dots i').forEach((e,j)=>e.classList.toggle('on',j==i))}
W.addEventListener('scroll',()=>requestAnimationFrame(on));
const CATS=['食事','交通','クラブ','マッサージ','入場料','その他'];
function close_(){S.classList.remove('open')}
function row(di,ri){const r=ri<0?{tm:'',name:'',note:'',c:0,k:'食事',q:''}:P.days[di].rows[ri];
S.innerHTML=`<div class="ttl">${ri<0?'追加':'編集'} · DAY ${di}</div><div class="row2"><div><label>時間</label><input id="f_tm" value="${esc(r.tm)}"></div><div><label>金額 ฿/人</label><input id="f_c" type="number" inputmode="numeric" value="${+r.c||0}"></div></div>
<label>名称</label><input id="f_name" value="${esc(r.name)}"><label>説明</label><input id="f_note" value="${esc(r.note)}">
<div class="row2"><div><label>分類</label><select id="f_k">${CATS.map(c=>`<option ${c==(r.k||'その他')?'selected':''}>${c}</option>`).join('')}</select></div><div><label>地図検索（英語名＋都市）</label><input id="f_q" value="${esc(r.q)}"></div></div>
${swSel(r,'各自払い')}<div class="acts">${ri<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={tm:$('#f_tm').value,name:$('#f_name').value,note:$('#f_note').value,c:+$('#f_c').value||0,k:$('#f_k').value,q:$('#f_q').value,s:$('#f_s').value=='1'};const rows=P.days[di].rows;ri<0?rows.push(n):rows[ri]=n;rows.sort((a,b)=>a.tm.localeCompare(b.tm));save()};
if(ri>=0)$('#b_del').onclick=()=>{P.days[di].rows.splice(ri,1);save()}}
function club(di,ci){const d=P.days[di];d.clubs=d.clubs||[];const c=ci<0?{name:'',q:'',note:'',price:'',hours:''}:d.clubs[ci];
S.innerHTML=`<div class="ttl">クラブ · DAY ${di}</div><label>名称</label><input id="f_name" value="${esc(c.name)}"><label>特徴</label><input id="f_note" value="${esc(c.note)}">
<div class="row2"><div><label>料金</label><input id="f_p" value="${esc(c.price)}"></div><div><label>営業時間</label><input id="f_h" value="${esc(c.hours)}"></div></div><label>地図検索（英語名＋都市）</label><input id="f_q" value="${esc(c.q)}">
<div class="acts">${ci<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={name:$('#f_name').value,note:$('#f_note').value,price:$('#f_p').value,hours:$('#f_h').value,q:$('#f_q').value};ci<0?d.clubs.push(n):d.clubs[ci]=n;save()};if(ci>=0)$('#b_del').onclick=()=>{d.clubs.splice(ci,1);save()}}
function ext(i){const x=i<0?{name:'',c:0}:P.extra[i];S.innerHTML=`<div class="ttl">予算項目</div><label>名称</label><input id="f_name" value="${esc(x.name)}"><label>金額 ฿（${P.people}人合計）</label><input id="f_c" type="number" inputmode="numeric" value="${+x.c||0}">${swSel(x,'支払者のみ')}<label>支払者（しない場合）</label><select id="f_p">${['',...MEM].map(m=>`<option value="${m}" ${m==(x.p||'')?'selected':''}>${m||'3人で各自'}</option>`).join('')}</select>
<div class="acts">${i<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={name:$('#f_name').value,c:+$('#f_c').value||0,s:$('#f_s').value=='1',p:$('#f_p').value};i<0?P.extra.push(n):P.extra[i]=n;save()};if(i>=0)$('#b_del').onclick=()=>{P.extra.splice(i,1);save()}}
function rate(){S.innerHTML=`<div class="ttl">レート</div><label>1฿ = ¥</label><input id="f_r" type="number" step="0.01" value="${P.rate}"><div class="acts"><button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');$('#b_ok').onclick=()=>{P.rate=+$('#f_r').value||P.rate;save()}}
async function save(){let k=localStorage.getItem('tp_key');if(!k){k=prompt('編集用の共有パスワード');if(!k){toast('パスワードが必要です',1);return}}
try{const r=await fetch('/api/plan',{method:'PUT',headers:{'content-type':'application/json','x-edit-key':k},body:JSON.stringify(P)});
if(r.status==401){localStorage.removeItem('tp_key');throw Error('パスワードが違います')}if(!r.ok)throw Error('HTTP '+r.status);
localStorage.setItem('tp_key',k);close_();render();toast('保存しました')}catch(e){toast('保存失敗：'+e.message,1);load(true)}}
async function load(q){try{const r=await fetch('/api/plan',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.days)P=j}}catch(e){if(!q)toast('オフライン表示',1)}render()}
document.getElementById('eb').onclick=e=>{E=!E;document.body.classList.toggle('editing',E);e.target.classList.toggle('on',E);e.target.textContent=E?'✓':'✎';if(!E)close_()};
render();const hs=parseInt(location.hash.slice(1));if(hs)W.scrollLeft=hs*W.clientWidth;on();if(location.protocol!='file:')load();
</script></body></html>
