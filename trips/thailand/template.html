<body>
<header id="top"><div class="tt"><b>タイ · バンコク＋パタヤ</b><small>2026/11/22–28 · Hiro · Fujisaki · Li</small></div><button class="eb" id="eb" aria-label="編集モード">✎</button></header>
<main id="main">
<section class="view on" id="v-today"></section>
<section class="view" id="v-plan"></section>
<section class="view" id="v-money"></section>
<section class="view" id="v-prep"></section>
</main>
<nav id="tabbar">
<button data-t="today" class="on" onclick="tab('today')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>今日</button>
<button data-t="plan" onclick="tab('plan')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>プラン</button>
<button data-t="money" onclick="tab('money')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h.01"/></svg>お金</button>
<button data-t="prep" onclick="tab('prep')"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>準備</button>
</nav>
<div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>
<script>

const DEF=__PLAN__;let P=JSON.parse(JSON.stringify(DEF)),E=false;
const W=document.getElementById('w'),S=document.getElementById('sheet'),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen=b=>'¥'+(Math.round(b*P.rate/100)*100).toLocaleString(),th=b=>'฿'+Number(b).toLocaleString();
const map=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const M='Metropole Bangkok Tribute Portfolio Hotel',WAL='<a class="btn" href="https://walica.jp/group/01M6DMSTVSD5AKZDK68FS8JGV6" target="_blank">割り勘（walica）</a>';
const MEM=['Hiro','Fujisaki','Li'];const on_=x=>x.s!==false;
const sp=x=>` <span class="sp ${on_(x)?'':'no'}">${on_(x)?'割り勘'+(x.w&&x.w.length&&x.w.length<MEM.length?'・'+x.w.length+'人':''):'各自'}</span>`;
function act(){const use={},paid={};MEM.forEach(m=>{use[m]=0;paid[m]=0});let sh=0;
const add=(c,payer,split,owner,who)=>{if(!c)return;if(paid[payer]==null)return;paid[payer]+=c;if(split){const W=who&&who.length?who:MEM;sh+=c;W.forEach(m=>{if(use[m]!=null)use[m]+=c/W.length})}else use[owner||payer]+=c};
P.days.forEach(d=>d.rows.forEach(r=>{if(+r.a)add(+r.a,r.p,on_(r))}));
MEM.forEach(m=>((P.personal||{})[m]||[]).forEach(x=>add(+x.c||0,m,on_(x),null,x.w)));
const bal=MEM.map(m=>[m,paid[m]-use[m]]),tr=[];let D=bal.filter(b=>b[1]<-.5).map(b=>[b[0],-b[1]]),C=bal.filter(b=>b[1]>.5);
while(D.length&&C.length){const v=Math.min(D[0][1],C[0][1]);tr.push([D[0][0],C[0][0],v]);D[0][1]-=v;C[0][1]-=v;if(D[0][1]<.5)D.shift();if(C[0][1]<.5)C.shift()}
return{use,paid,g:Object.values(paid).reduce((a,b)=>a+b,0),sh,tr}}
function calc(){const per={};MEM.forEach(m=>per[m]=0);let spl=0;
P.days.forEach(d=>d.rows.forEach(r=>{const c=+r.c||0;if(on_(r))spl+=c*P.people;else MEM.forEach(m=>per[m]+=c)}));
P.extra.forEach(x=>{const c=+x.c||0;if(on_(x))spl+=c;else if(per[x.p]!=null)per[x.p]+=c;else MEM.forEach(m=>per[m]+=c/P.people)});
MEM.forEach(m=>per[m]+=spl/P.people);return{per,sp:spl,g:Object.values(per).reduce((a,b)=>a+b,0)}}
const swSel=(x,lbl)=>`<label>割り勘</label><select id="f_s"><option value="1" ${on_(x)?'selected':''}>割り勘する（${P.people}人で分ける）</option><option value="0" ${on_(x)?'':'selected'}>しない（${lbl}）</option></select>`;
function per(m,i){P.personal=P.personal||{};const L=P.personal[m]=P.personal[m]||[];const x=i<0?{name:'',c:0,s:true}:L[i];
let sm=on_(x)?'1':'0';const who=new Set(x.w&&x.w.length?x.w:MEM);
S.innerHTML=`<div class="ttl">${m} · ${i<0?'追加':'編集'}</div><label>項目</label><input id="f_name" value="${esc(x.name)}"><label>金額 ฿</label><input id="f_c" type="number" inputmode="numeric" value="${+x.c||0}"><label>割り勘</label><div class="seg" id="f_seg"><button type="button" data-v="1">割り勘する</button><button type="button" data-v="0">${m}だけ</button></div><div id="f_who"><label>分ける相手（タップで切替）</label><div class="mchips" id="f_chips">${MEM.map(mm=>`<button type="button" data-m="${mm}">${mm}</button>`).join('')}</div></div>
<div class="acts">${i<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');

// 時刻: 出発/帰国はJST固定の絶対時刻、日付の切替（終了判定・Day N）はタイ時間(UTC+7)。端末のタイムゾーンに依存しない。
const QN=new URLSearchParams(location.search).get('now');function pq(q){q=String(q||'').replace(/(\d) (\d\d:\d\d)$/,'$1+$2');const m=q.match(/^(\d{4})-(\d\d)-(\d\d)(?:[T ](\d\d):(\d\d)(?::(\d\d))?)?(Z|[+-]\d\d:?\d\d)?$/);if(!m)return NaN;let o=9*60;if(m[7]){o=m[7]=='Z'?0:(m[7][0]=='-'?-1:1)*(+m[7].slice(1,3)*60+ +m[7].slice(-2))}return Date.UTC(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0))-o*6e4}
const QT=pq(QN);const NOW=()=>new Date(isFinite(QT)?QT:Date.now());
const DEP=Date.parse('2026-11-22T18:30:00+09:00'),RET=Date.parse('2026-11-29T08:00:00+09:00');let ORD=[];
const dd=d=>{const m=String(d.d).match(/(\d+)\/(\d+)/);return m?[+m[1],+m[2]]:null};
function past(d){const x=dd(d);if(!x)return false;const e=Date.UTC(2026,x[0]-1,x[1],17);return isFinite(e)&&+NOW()>=e}
function cdH(){const n=+NOW();if(n>=DEP)return `<div class="cd">${cdT()}</div>`;
return `<div class="k">出発まで</div><div class="fc">${['日','時','分','秒'].map((u,i)=>`<div><div class="ft" data-i="${i}"><span>--</span></div><small>${u}</small></div>`).join('')}</div>`}
function tick(){const n=+NOW()+(isFinite(QT)?(Date.now()-T0):0);if(n>=DEP){const e=document.getElementById('cd');if(e&&e.querySelector('.fc'))e.innerHTML=cdH();return}
const t=Math.floor((DEP-n)/1e3),v=[Math.floor(t/86400),Math.floor(t%86400/3600),Math.floor(t%3600/60),t%60];
document.querySelectorAll('.ft').forEach(e=>{const x=String(v[e.dataset.i]).padStart(2,'0'),sp=e.firstChild;if(sp.textContent!==x){sp.textContent=x;e.classList.remove('flip');void e.offsetWidth;e.classList.add('flip')}})}
const T0=Date.now();setInterval(tick,1000);
function cdT(){const n=+NOW();if(n<DEP){const t=Math.floor((DEP-n)/6e4);return `出発まで <b>${Math.floor(t/1440)}</b>日 <b>${Math.floor(t%1440/60)}</b>時間 <b>${t%60}</b>分`}
if(n<RET){const b=new Date(n+7*36e5),i=P.days.findIndex(d=>{const x=dd(d);return x&&x[0]==b.getUTCMonth()+1&&x[1]==b.getUTCDate()});return `旅行中 <b>Day ${i<0?'—':i}</b>`}return 'お疲れさまでした'}

function ext(i){const x=i<0?{name:'',c:0}:P.extra[i];S.innerHTML=`<div class="ttl">予算項目</div><label>名称</label><input id="f_name" value="${esc(x.name)}"><label>金額 ฿（${P.people}人合計）</label><input id="f_c" type="number" inputmode="numeric" value="${+x.c||0}">${swSel(x,'支払者のみ')}<label>支払者（しない場合）</label><select id="f_p">${['',...MEM].map(m=>`<option value="${m}" ${m==(x.p||'')?'selected':''}>${m||'3人で各自'}</option>`).join('')}</select>
<div class="acts">${i<0?'':'<button class="del" id="b_del">削除</button>'}<button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');
$('#b_ok').onclick=()=>{const n={name:$('#f_name').value,c:+$('#f_c').value||0,s:$('#f_s').value=='1',p:$('#f_p').value};i<0?P.extra.push(n):P.extra[i]=n;save()};if(i>=0)$('#b_del').onclick=()=>{P.extra.splice(i,1);save()}}
function rate(){S.innerHTML=`<div class="ttl">レート</div><label>1฿ = ¥</label><input id="f_r" type="number" step="0.01" value="${P.rate}"><div class="acts"><button class="cn" onclick="close_()">閉じる</button><button class="ok" id="b_ok">保存</button></div>`;S.classList.add('open');$('#b_ok').onclick=()=>{P.rate=+$('#f_r').value||P.rate;save()}}
function askKey(){return new Promise(res=>{const d=document.createElement('div');d.className='pw';d.innerHTML=`<div class="glass"><div class="k">編集パスワード（共有）</div><input type="password" id="pw_i" autocomplete="current-password"><small>一度保存すればこの端末では次から不要</small><div class="acts"><button class="cn">取消</button><button class="ok">OK</button></div></div>`;document.body.appendChild(d);
const i=d.querySelector('input'),f=v=>{d.remove();res(v)};i.focus();d.querySelector('.cn').onclick=()=>f('');d.querySelector('.ok').onclick=()=>f(i.value.trim());i.onkeydown=e=>{if(e.key=='Enter')f(i.value.trim())}})}
async function save(){let k=localStorage.getItem('tp_key');if(!k){k=await askKey();if(!k){toast('パスワードが必要です',1);return}}
try{const r=await fetch('/api/plan',{method:'PUT',headers:{'content-type':'application/json','x-edit-key':k},body:JSON.stringify(P)});
if(r.status==401){localStorage.removeItem('tp_key');throw Error('パスワードが違います')}if(!r.ok)throw Error('HTTP '+r.status);
localStorage.setItem('tp_key',k);close_();render();toast('保存しました')}catch(e){toast('保存失敗：'+e.message,1);load(true)}}
async function load(q){try{const r=await fetch('/api/plan',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.days)P=j}}catch(e){if(!q)toast('オフライン表示',1)}render()}
document.getElementById('eb').onclick=e=>{E=!E;document.body.classList.toggle('editing',E);e.target.classList.toggle('on',E);e.target.textContent=E?'✓':'✎';if(!E)close_()};

MN.addEventListener('scroll',()=>requestAnimationFrame(spy));
render();
const h0=location.hash.slice(1),dm=h0.match(/^day-(\d+)$/);
if(dm)jumpDay(+dm[1]);else if(['plan','money','prep'].indexOf(h0)>=0)tab(h0,true);else tab('today',true);
if(location.protocol!='file:')load();
</script>
